<svg width="220" height="48" viewBox="0 0 220 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headerBadgeGrad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2d2d2d"/>
    </linearGradient>
    <linearGradient id="headerBlueGrad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#004499"/>
    </linearGradient>
  </defs>

  <!-- Circular Badge Group -->
  <g id="logo-badge">
    <!-- Outer accent ring -->
    <circle cx="24" cy="24" r="22" fill="url(#headerBadgeGrad)" stroke="url(#headerBlueGrad)" stroke-width="2"/>
    <!-- Geometric decorative inner arc -->
    <path d="M 9 24 A 15 15 0 0 1 39 24" stroke="#0066cc" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 2.5" fill="none"/>
    <!-- "M" Monogram -->
    <text x="13.5" y="28.5" font-family="'Poppins', 'Montserrat', sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="-0.5">M</text>
    <!-- "S" Monogram -->
    <text x="25.5" y="28.5" font-family="'Poppins', 'Montserrat', sans-serif" font-weight="800" font-size="14" fill="#0066cc" letter-spacing="-0.5">S</text>
  </g>

  <!-- Brand Typography / Wordmark -->
  <g id="logo-text">
    <text x="56" y="25" font-family="'Poppins', 'Montserrat', sans-serif" font-weight="800" font-size="20" fill="#1a1a1a" letter-spacing="-0.3">MS</text>
    <text x="91" y="25" font-family="'Poppins', 'Montserrat', sans-serif" font-weight="700" font-size="20" fill="#0066cc" letter-spacing="-0.3">SERVICES</text>
    <text x="56" y="39" font-family="'Open Sans', sans-serif" font-weight="600" font-size="8.5" fill="#4a4a4a" letter-spacing="3.2">DIGITAL &amp; TECH SOLUTIONS</text>
  </g>
</svg>
